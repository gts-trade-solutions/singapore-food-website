# Nginx site for rjsstore.com. It passes every request to the Next.js app on 127.0.0.1:3100.
# enable-site.sh installs it as /etc/nginx/sites-available/rjsstore.com.
# Certbot then adds the HTTPS (port 443) part and the http -> https redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name rjsstore.com www.rjsstore.com;

    client_max_body_size 5m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
